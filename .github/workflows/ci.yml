name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  # A build that cannot read its corpus must never report success. Under a low
  # fd limit content-collections lost 2,758 of 3,000 documents and exited 0.
  fd-limit:
    name: silent-data-loss gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: ./scripts/fd-limit-gate.sh

  adapters:
    name: adapter parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # A real bundler, not just the plugin hooks: calling hooks in the wrong
      # order once hid an alias that Vite rejects outright.
      - run: node --experimental-strip-types scripts/verify-vite.mjs
      # Our type tests import `../src`; a user imports the emitted `.d.ts`. Two
      # type bugs shipped through that gap and failed real `next build`s.
      - run: pnpm verify:types
      # A migrated config has to build, not merely look like a config. This
      # caught a rewrite that referenced a parameter the function never declared.
      - run: pnpm verify:migrate

  examples:
    name: real framework builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Next, Nuxt, Astro and webpack, each with its own toolchain. Writing
      # these four applications turned up four bugs that every hook-level test
      # had passed over, including a Nuxt module that never ran at all.
      - run: pnpm verify:examples

  bench:
    name: performance gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Ceilings for a 4-core shared runner, not for a laptop. Measured on this
      # hardware: cold 2125ms, rescan 396ms, rss 393MB. Set roughly 2x, so a
      # real regression still trips the gate while normal runner variance does
      # not. The strict local defaults live in the script.
      - run: node scripts/bench.mjs 10000
        env:
          BENCH_COLD_MS: 8000
          BENCH_RESCAN_MS: 800
          BENCH_RSS_MB: 600
      - run: node scripts/bundle-size.mjs

  publish-check:
    name: publint + are-the-types-wrong
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check:publish
